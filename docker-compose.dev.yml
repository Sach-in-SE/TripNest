# ==============================================================================
# TripNest — Local Development Docker Compose Configuration (MySQL)
# Usage: docker compose -f docker-compose.dev.yml up -d
# ==============================================================================

services:

  # ==========================================
  # MySQL Database (Local Development)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: tripnest-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: tripnest_db
      MYSQL_USER: tripnest_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tripnest_password}

    volumes:
      - tripnest-mysql-data:/var/lib/mysql

    ports:
      - "3306:3306"

    networks:
      - tripnest-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ==========================================
  # Spring Boot Backend (Development)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tripnest-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_FORWARD_HEADERS_STRATEGY: native

      SPRING_DATASOURCE_URL: jdbc:mysql://tripnest-mysql:3306/tripnest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: tripnest_user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-tripnest_password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-key-change-me-12345678901234567890}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      TRIPNEST_UPLOAD_DIR: /app/uploads

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tripnest.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DevAdminPassword123!}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@tripnest.com}

      STORAGE_TYPE: local

    volumes:
      - tripnest-uploads:/app/uploads

    networks:
      - tripnest-network

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ==========================================
  # React + Nginx Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_BACKEND_URL: ""

    container_name: tripnest-frontend
    restart: unless-stopped

    environment:
      BACKEND_URL: ${BACKEND_URL:-http://tripnest-backend:8080}

    ports:
      - "80:80"

    networks:
      - tripnest-network

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s


# ==========================================
# Networks
# ==========================================
networks:
  tripnest-network:
    driver: bridge


# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  tripnest-mysql-data:
    driver: local

  tripnest-uploads:
    driver: local
