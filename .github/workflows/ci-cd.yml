name: TripNest CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (Spring Boot & Java 17)
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Executable Permissions to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests & Verify Build
        run: ./mvnw clean verify

  # ==========================================
  # 2. Frontend CI (React 19 & Vite 8)
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Clean Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Unit & Integration Tests (vitest)
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

  # ==========================================
  # 3. Containerization Build Verification
  # ==========================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tripnest-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: tripnest-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
