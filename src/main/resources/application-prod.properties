# ==============================================================================
# TripNest — Production Spring Boot Profile Overrides (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================

# Production Database & JPA Integrity (PostgreSQL default for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripnest_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# HikariCP Production Connection Pool (Tuned for Azure PostgreSQL Flexible Server & container scaling)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:3}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1200000}

# Forwarded Headers Recognition (Azure Container Apps / Reverse Proxy / SSL Termination)
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# Graceful Shutdown Configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Server Error Handling (Never leak stacktraces or exception messages)
server.error.include-stacktrace=never
server.error.include-message=never

# Production Logging Configuration
logging.level.org.springframework.security=WARN
logging.level.com.tripnest=INFO

# Production Actuator Hardening
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=false

# Production Storage Configuration (Defaults to Azure Blob in production)
tripnest.storage.type=${STORAGE_TYPE:azure}
tripnest.storage.azure.connection-string=${STORAGE_AZURE_CONNECTION_STRING:}
tripnest.storage.azure.container-name=${STORAGE_AZURE_CONTAINER:tripnest-media}
tripnest.storage.azure.endpoint=${STORAGE_AZURE_ENDPOINT:}

# Frontend URL & CORS Configuration (Overridden in production by environment variables)
app.frontend.url=${FRONTEND_URL:http://localhost}
tripnest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}
