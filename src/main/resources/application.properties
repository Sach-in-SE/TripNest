spring.application.name=tripnest
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db
spring.datasource.username=root
spring.datasource.password=lucky18
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & SQL Initialization Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

tripnest.app.jwtSecret=tripnestSecretKey123456789012345678901234567890
tripnest.app.jwtExpirationMs=86400000

tripnest.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Email Configuration (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@tripnest.com}

# Frontend URL for email links
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Server Port
server.port=8080