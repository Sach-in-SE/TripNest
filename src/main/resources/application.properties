spring.application.name=tripnest
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tripnest_db
spring.datasource.username=root
spring.datasource.password=lucky18
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

tripnest.app.jwtSecret=tripnestSecretKey123456789012345678901234567890
tripnest.app.jwtExpirationMs=86400000

tripnest.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Email Configuration (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@tripnest.com}

# Frontend URL for email links
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Admin Credentials Configuration (Environment-backed)
tripnest.admin.email=${ADMIN_EMAIL:admin@tripnest.com}
tripnest.admin.username=${ADMIN_USERNAME:admin}
# Development-only default password. In production, override via ADMIN_PASSWORD environment variable.
tripnest.admin.password=${ADMIN_PASSWORD:DevAdminPassword123!}

# Storage Configuration (Environment-backed: local or s3)
tripnest.storage.type=${STORAGE_TYPE:local}
tripnest.storage.s3.bucket=${STORAGE_S3_BUCKET:tripnest-documents}
tripnest.storage.s3.region=${STORAGE_S3_REGION:us-east-1}
tripnest.storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
tripnest.storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
tripnest.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}

# Server Port
server.port=8080